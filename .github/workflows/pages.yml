name: Publish digest

# Builds the digest from approved items on the `data` branch and deploys it to GitHub Pages.
# Runs after each weekly run and on demand (`make publish` after pushing reviews).
# A `push` trigger on `data` would not work: GitHub reads that workflow from the data branch,
# which holds only records. Requires Pages source set to "GitHub Actions".

on:
  workflow_run:
    workflows: ["Weekly run"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add data-branch FETCH_HEAD
          else
            mkdir -p data-branch/data
          fi
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run spidercrawler digest --data-dir data-branch/data --out-dir _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
