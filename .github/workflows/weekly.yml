name: Weekly run

# Fetch, detect, extract, verify, route; commit new JSON records to the `data` branch.
# Needs: secret SPIDERCRAWLER_CONTACT_EMAIL (user agent contact; a secret, not a variable,
# because this repository's Actions logs are public and variables are printed in them) and,
# for the LLM step, secret ANTHROPIC_API_KEY (without it the run records "extraction skipped").

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC (8 or 9 am Eastern)
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed run: record items without extracting"
        type: boolean
        default: false
      source:
        description: "With seed: only this source id (empty = all)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the data branch (create it on first run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add data-branch FETCH_HEAD
            git -C data-branch switch -c data
          else
            git worktree add --orphan -b data data-branch
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked

      - name: Run the pipeline
        id: pipeline
        env:
          SPIDERCRAWLER_CONTACT_EMAIL: ${{ secrets.SPIDERCRAWLER_CONTACT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEED: ${{ inputs.seed }}
          SOURCE: ${{ inputs.source }}
        run: |
          args=(--data-dir data-branch/data)
          if [ "$SEED" = "true" ]; then
            args+=(--seed)
            if [ -n "$SOURCE" ]; then args+=(--source "$SOURCE"); fi
          fi
          set +e
          uv run spidercrawler run "${args[@]}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: uv run spidercrawler summary --data-dir data-branch/data >> "$GITHUB_STEP_SUMMARY"

      - name: Commit new records to the data branch
        if: always()
        run: |
          cd data-branch
          # A refused or crashed run may write no records at all; that is not a git error.
          if [ ! -d data ]; then
            echo "No records written."
            exit 0
          fi
          git add data
          if git diff --cached --quiet; then
            echo "No new records."
          else
            git commit -q -m "Weekly run $(date -u +%Y-%m-%d)"
            # Reviews may have been pushed meanwhile. Records are always new, distinct files,
            # so rebasing onto them cannot conflict; retry instead of losing this run.
            for _ in 1 2 3; do
              git push origin data && exit 0
              git pull --rebase origin data
            done
            exit 1
          fi

      # A broken or unreachable source fails the job so GitHub emails the maintainer.
      - name: Fail if the run failed
        if: steps.pipeline.outputs.exit_code != '0'
        run: |
          echo "spidercrawler run exited with ${{ steps.pipeline.outputs.exit_code }}"
          exit 1

  # Tell the maintainer when an item awaits review: one open issue labeled `review-needed`,
  # updated in place and closed when the queue is empty. Titles and source links only.
  notify:
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add data-branch FETCH_HEAD
          else
            mkdir -p data-branch/data
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Open, update, or close the review issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          uv run spidercrawler review-notice --data-dir data-branch/data > notice.md
          title=$(uv run spidercrawler review-notice --data-dir data-branch/data --title)
          mapfile -t open < <(gh issue list --label review-needed --state open \
            --json number --jq 'sort_by(.number) | .[].number')
          if [ -s notice.md ]; then
            if [ "${#open[@]}" -gt 0 ]; then
              gh issue edit "${open[0]}" --title "$title" --body-file notice.md
            else
              gh label create review-needed --force --color D93F0B \
                --description "A rule item awaits human review"
              gh issue create --title "$title" --body-file notice.md --label review-needed
            fi
          else
            for number in "${open[@]}"; do
              gh issue close "$number" --comment "Nothing is awaiting review."
            done
          fi
