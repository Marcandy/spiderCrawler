# Pennsylvania Supreme Court rules committee pages (PLAN.md section 3).
# All pages share one template: Proposed / Approved / Prior Proposed tables.
# Access record: docs/SOURCES.md

base_url: https://www.pacourts.us/courts/supreme-court/committees/rules-committees/

limits:
  min_delay_seconds: 5
  max_requests_per_run: 30
  max_extractions_per_run: 20   # LLM calls per run (PLAN section 6, runaway cost)
  max_tokens_per_run: 400000    # input + output tokens per run; stop before exceeding
  max_output_tokens: 8000       # per call; includes thinking tokens, so not too low

# Volume guards: a page that suddenly shows many "new" items (e.g. the site moved its PDFs)
# or far fewer rows than last time marks the source broken and records nothing.
# After checking the page, accept it with `spidercrawler run --seed --source <id>`.
guards:
  max_new_items: 10     # more new items than this in one run on one page
  max_new_ratio: 0.25   # or more than this share of the items already known for the page
  min_rows_ratio: 0.5   # fewer rows than this share of the last good run

# The one LLM step. Override with SPIDERCRAWLER_MODEL / SPIDERCRAWLER_EFFORT.
# No sampling parameters: current models reject them; the eval uses a response cache.
extractor:
  model: claude-sonnet-5-5
  effort: medium
  # v2 adds up to related_chunks chunks of earlier source documents about the same rules
  # (lexical retrieval, docs/AGENTIC.md section 2). v1 stays the default until the dev eval
  # shows v2 helps: `spidercrawler eval --prompt v2`.
  prompt: v1
  related_chunks: 3

# Verifier-feedback repair loop: after a verifier failure, show the model the reasons and
# ask for a corrected output, at most this many times (0 = off, hard cap 2). Each repair
# call counts against max_extractions_per_run. Off until the dev eval has measured it:
# `spidercrawler eval --repair 1` (docs/AGENTIC.md section 1).
repair:
  max_repairs: 0

# Review assistant: a read-only, tool-using second opinion on each extraction, shown to the
# reviewer as "AI second opinion, not verified". It can only move an item from
# ready_for_review to needs_attention. Each model turn counts against the run budget.
# `spidercrawler assist <extraction_id>` runs it by hand. model: "" means the extractor's.
assistant:
  in_pipeline: false
  model: ""
  effort: medium
  max_steps: 8
  max_tokens: 80000

# Contact email for the user agent. Override with SPIDERCRAWLER_CONTACT_EMAIL.
# Live runs refuse to start while this is the placeholder.
contact_email: CHANGE-ME@example.com

sources:
  - id: crim
    name: Criminal Procedural Rules Committee
    slug: criminal-procedural-rules-committee
    role: focus
    rule_prefix: Pa.R.Crim.P.
  - id: appellate
    name: Appellate Court Procedural Rules Committee
    slug: appellate-court-procedural-rules-committee
    role: context
    rule_prefix: Pa.R.A.P.
  - id: civil
    name: Civil Procedural Rules Committee
    slug: civil-procedural-rules-committee
    role: context
    rule_prefix: Pa.R.Civ.P.
  - id: evidence
    name: Committee on Rules of Evidence
    slug: committee-on-rules-of-evidence
    role: context
    rule_prefix: Pa.R.E.
  - id: domestic
    name: Domestic Relations Procedural Rules Committee
    slug: domestic-relations-procedural-rules-committee
    role: context
    rule_prefix: Pa.R.Civ.P.
  - id: juvenile
    name: Juvenile Court Procedural Rules Committee
    slug: juvenile-court-procedural-rules-committee
    role: context
    rule_prefix: Pa.R.J.C.P.
  - id: minor
