# Pennsylvania Supreme Court rules committee pages (PLAN.md section 3).
# All pages share one template: Proposed / Approved / Prior Proposed tables.
# Access record: docs/SOURCES.md

base_url: https://www.pacourts.us/courts/supreme-court/committees/rules-committees/

limits:
  min_delay_seconds: 5
  max_requests_per_run: 30

# Volume guards: a page that suddenly shows many "new" items (e.g. the site moved its PDFs)
# or far fewer rows than last time marks the source broken and records nothing.
# After checking the page, accept it with `spidercrawler run --seed --source <id>`.
guards:
  max_new_items: 10     # more new items than this in one run on one page
  max_new_ratio: 0.25   # or more than this share of the items already known for the page
  min_rows_ratio: 0.5   # fewer rows than this share of the last good run

# Contact email for the user agent. Override with SPIDERCRAWLER_CONTACT_EMAIL.
# Live runs refuse to start while this is the placeholder.
contact_email: CHANGE-ME@example.com

sources:
  - id: crim
    name: Criminal Procedural Rules Committee
    slug: criminal-procedural-rules-committee
    role: focus
    rule_prefix: Pa.R.Crim.P.
  - id: appellate
    name: Appellate Court Procedural Rules Committee
    slug: appellate-court-procedural-rules-committee
    role: context
    rule_prefix: Pa.R.A.P.
  - id: civil
    name: Civil Procedural Rules Committee
    slug: civil-procedural-rules-committee
    role: context
    rule_prefix: Pa.R.Civ.P.
  - id: evidence
    name: Committee on Rules of Evidence
    slug: committee-on-rules-of-evidence
    role: context
    rule_prefix: Pa.R.E.
  - id: domestic
    name: Domestic Relations Procedural Rules Committee
    slug: domestic-relations-procedural-rules-committee
    role: context
    rule_prefix: Pa.R.Civ.P.
  - id: juvenile
    name: Juvenile Court Procedural Rules Committee
    slug: juvenile-court-procedural-rules-committee
    role: context
    rule_prefix: Pa.R.J.C.P.
  - id: minor
    name: Minor Court Rules Committee
    slug: minor-court-rules-committee
